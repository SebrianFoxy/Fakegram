definitions:
  models.ChatListItem:
    properties:
      avatar_url:
        type: string
      chat_type:
        $ref: '#/definitions/models.ChatType'
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      last_message:
        $ref: '#/definitions/models.Message'
      members:
        items:
          $ref: '#/definitions/models.User'
        type: array
      other_user:
        $ref: '#/definitions/models.User'
      title:
        type: string
      unread_count:
        type: integer
      updated_at:
        type: string
    type: object
  models.ChatType:
    enum:
    - private
    - group
    type: string
    x-enum-varnames:
    - ChatTypePrivate
    - ChatTypeGroup
  models.CreateGroupChatRequest:
    properties:
      avatar_url:
        type: string
      description:
        maxLength: 1000
        type: string
      member_ids:
        items:
          type: string
        minItems: 1
        type: array
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - member_ids
    - title
    type: object
  models.CreateMessageRequest:
    properties:
      chat_id:
        type: string
      message_text:
        type: string
      message_type:
        allOf:
        - $ref: '#/definitions/models.MessageType'
        enum:
        - text
        - image
        - file
        - video
        - audio
      receiver_id:
        type: string
      reply_to_message_id:
        type: string
    required:
    - chat_id
    - message_text
    - message_type
    type: object
  models.GetMessagesResponse:
    properties:
      count:
        type: integer
      cursors:
        $ref: '#/definitions/models.MessageCursors'
      first_msg_time:
        type: string
      has_more_newer:
        type: boolean
      has_more_older:
        type: boolean
      last_msg_time:
        type: string
      messages:
        items:
          $ref: '#/definitions/models.MessageDetail'
        type: array
      total_unread:
        type: integer
    type: object
  models.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.Message:
    properties:
      chat_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      is_edited:
        type: boolean
      message_text:
        type: string
      message_type:
        $ref: '#/definitions/models.MessageType'
      reply_to_message_id:
        type: string
      sender_id:
        type: string
      updated_at:
        type: string
    required:
    - sender_id
    type: object
  models.MessageCursors:
    properties:
      newer:
        type: string
      older:
        type: string
    type: object
  models.MessageDetail:
    properties:
      chat_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      is_edited:
        type: boolean
      is_read:
        type: boolean
      message_text:
        type: string
      message_type:
        $ref: '#/definitions/models.MessageType'
      read_at:
        type: string
      read_by:
        items:
          $ref: '#/definitions/models.MessageReadInfo'
        type: array
      reply_to_message:
        $ref: '#/definitions/models.MessageDetail'
      reply_to_message_id:
        type: string
      sender:
        $ref: '#/definitions/models.UserDetail'
      sender_id:
        type: string
      updated_at:
        type: string
    required:
    - sender_id
    type: object
  models.MessageReadInfo:
    properties:
      avatar_url:
        type: string
      name:
        type: string
      nickname:
        type: string
      read_at:
        type: string
      surname:
        type: string
      user_id:
        type: string
    type: object
  models.MessageType:
    enum:
    - text
    - image
    - file
    type: string
    x-enum-varnames:
    - MessageTypeText
    - MessageTypeImage
    - MessageTypeFile
  models.RefreshRequest:
    properties:
      refresh_rotate:
        type: boolean
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  models.RegistrationRequest:
    properties:
      email:
        type: string
      name:
        type: string
      nickname:
        type: string
      password:
        minLength: 6
        type: string
      surname:
        type: string
    required:
    - email
    - name
    - nickname
    - password
    - surname
    type: object
  models.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  models.UpdateMessageRequest:
    properties:
      message_text:
        type: string
    required:
    - message_text
    type: object
  models.User:
    properties:
      approved:
        type: boolean
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_online:
        type: boolean
      last_seen:
        type: string
      name:
        type: string
      nickname:
        type: string
      password:
        type: string
      surname:
        type: string
      updated_at:
        type: string
    required:
    - email
    - name
    - nickname
    - password
    - surname
    type: object
  models.UserDetail:
    properties:
      avatar_url:
        type: string
      name:
        type: string
      nickname:
        type: string
      surname:
        type: string
    type: object
  models.UserResponse:
    properties:
      approved:
        type: boolean
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_online:
        type: boolean
      last_seen:
        type: string
      name:
        type: string
      nickname:
        type: string
      surname:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: API с JWT авторизацией
  title: Fakegram API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет email и пароль
      parameters:
      - description: Данные для авторизации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная авторизация
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Неверный email или пароль
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Авторизация пользователя
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Обновляет access токен или оба токена с помощью refresh токена
      parameters:
      - description: Данные для обновления токенов
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешное обновление токенов
          schema:
            $ref: '#/definitions/models.TokenResponse'
        "400":
          description: Неверный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Невалидный или просроченный refresh token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Обновление токенов
      tags:
      - auth
  /api/v1/auth/registration:
    post:
      consumes:
      - application/json
      description: Регистрирует нового пользователя в системе
      parameters:
      - description: Данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан
          schema:
            $ref: '#/definitions/models.UserResponse'
        "400":
          description: Неверный формат данных
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email уже существует
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация
      tags:
      - auth
  /api/v1/chats:
    get:
      consumes:
      - application/json
      description: Возвращает список всех чатов (приватных и групповых) пользователя
        на основе JWT токена. Для приватных чатов автоматически устанавливается название
        в формате "Имя Фамилия" собеседника.
      produces:
      - application/json
      responses:
        "200":
          description: 'chats": "Список объектов ChatListItem", "count": "Количество
            чатов'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован - невалидный токен или claims
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить чаты пользователя
      tags:
      - chats
  /api/v1/chats/{chat_id}:
    get:
      consumes:
      - application/json
      description: Возвращает информацию о конкретном чате (приватном или групповом)
        пользователя
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Информация о чате
          schema:
            $ref: '#/definitions/models.ChatListItem'
        "400":
          description: Неверные параметры запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Неавторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Чат не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить чат по ID
      tags:
      - chats
  /api/v1/chats/group:
    post:
      consumes:
      - application/json
      description: Создает новый групповой чат с указанными участниками
      parameters:
      - description: Данные для создания группы
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateGroupChatRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Групповой чат успешно создан
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверные параметры запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Неавторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать групповой чат
      tags:
      - chats
  /api/v1/chats/search:
    get:
      consumes:
      - application/json
      description: Поиск пользователей и групп по никнейму или названию
      parameters:
      - description: Поисковый запрос
        in: query
        name: query
        required: true
        type: string
      - description: Лимит результатов (по умолчанию 20, максимум 100)
        in: query
        name: limit
        type: integer
      - description: Смещение для пагинации
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Результаты поиска
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверные параметры запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Неавторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Поиск чатов
      tags:
      - chats
  /api/v1/messages/{message_id}:
    delete:
      consumes:
      - application/json
      description: Удаление сообщения. Только отправитель может удалить свое сообщение
      parameters:
      - description: ID сообщения для удаления
        in: path
        name: message_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение успешно удалено
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверные параметры запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Неавторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Сообщение не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить сообщение
      tags:
      - messages
    put:
      consumes:
      - application/json
      description: Редактирование текста сообщения. Только отправитель может редактировать
        свое сообщение
      parameters:
      - description: ID сообщения для редактирования
        in: path
        name: message_id
        required: true
        type: string
      - description: Данные для редактирования сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение успешно отредактировано
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверные параметры запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Неавторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Сообщение не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Редактировать сообщение
      tags:
      - messages
  /api/v1/messages/chat/{chat_id}:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает сообщения из чата с поддержкой двунаправленной пагинации.
        При первой загрузке (direction=around) автоматически позиционирует на первом непрочитанном сообщении.
      parameters:
      - description: ID чата (private_user1_user2 или group_UUID)
        in: path
        name: chat_id
        required: true
        type: string
      - default: around
        description: 'Направление загрузки: around (первая загрузка вокруг непрочитанного),
          older (старые сообщения), newer (новые сообщения)'
        enum:
        - around
        - older
        - newer
        in: query
        name: direction
        type: string
      - description: Временная метка опорного сообщения в формате RFC3339 (например,
          2024-01-02T15:04:05Z). Обязателен для direction=older или direction=newer
        in: query
        name: cursor
        type: string
      - default: 30
        description: Количество сообщений (1-100)
        in: query
        maximum: 100
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список сообщений с информацией о пагинации
          schema:
            $ref: '#/definitions/models.GetMessagesResponse'
        "400":
          description: Неверные параметры (неверный direction, неверный формат cursor
            и т.д.)
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен (пользователь не является участником чата)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить сообщения чата
      tags:
      - messages
  /api/v1/messages/send:
    post:
      consumes:
      - application/json
      description: Отправляет сообщение. Для существующих диалогов используйте chat_id,
        для новых - receiver_id
      parameters:
      - description: Данные для отправки сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Сообщение отправлено
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверные данные запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Неавторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Отправить сообщение
      tags:
      - messages
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Возвращает информацию о пользователе на основе JWT токена
      produces:
      - application/json
      responses:
        "200":
          description: Информация о пользователе
          schema:
            $ref: '#/definitions/models.UserResponse'
        "401":
          description: Неавторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить текущего пользователя
      tags:
      - users
  /api/v1/users/all_users:
    get:
      consumes:
      - application/json
      description: Возвращает список пользователей с поддержкой пагинации
      parameters:
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Количество записей на странице
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список пользователей
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить пользователей
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
